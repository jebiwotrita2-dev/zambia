<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Login</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#7a8794; --accent:#229ed9; --border:#e3e8ed; --ok:#1a9b57; --bad:#d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1621; --card:#17212b; --text:#e8eef3; --muted:#7f91a4; --border:#243447; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; }
  h2 { margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 18px; line-height:1.5; }
  input, textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--text); font:inherit; margin-bottom:12px; }
  textarea { min-height:140px; resize:vertical; }
  button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .spinner { width:42px; height:42px; margin:0 auto 18px; border:4px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .hidden { display:none; }
  .btn { display:block; width:100%; padding:13px; margin-top:6px; border-radius:10px; background:var(--ok); color:#fff; font-weight:600; text-decoration:none; text-align:center; }
  #feed { text-align:left; }
  .msg { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px; white-space:pre-wrap; word-wrap:break-word; line-height:1.5; animation:in .3s ease; }
  @keyframes in { from { opacity:0; transform:translateY(-6px); } }
</style>
</head>
<body>
<div class="card">

  <!-- Step 1: login -->
  <div id="login">
    <h2>Sign in</h2>
    <p>Enter your name to request access.</p>
    <input id="username" placeholder="Your name" autocomplete="off">
    <button id="loginBtn">Continue</button>
    <p id="loginErr" class="bad" style="margin:10px 0 0"></p>
  </div>

  <!-- Step 2: waiting for Telegram approval (swap in your own design here) -->
  <div id="pending" class="hidden">
    <div class="spinner"></div>
    <h2>Waiting for approval…</h2>
    <p>Please keep this page open.</p>
  </div>

  <!-- Step 3: approved -> paste box -->
  <div id="approved" class="hidden">
    <h2 class="ok">✅ Approved</h2>
    <p id="feedHint">Waiting for a message…</p>
    <div id="feed"></div>
  </div>

  <!-- Rejected -->
  <div id="rejected" class="hidden">
    <h2 class="bad">❌ Access denied</h2>
    <p>Your request was not approved.</p>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let reqId = null, timer = null;

function show(step) {
  ['login','pending','approved','rejected'].forEach(s => $(s).classList.toggle('hidden', s !== step));
}

$('loginBtn').onclick = async () => {
  const username = $('username').value.trim();
  if (!username) return;
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    reqId = d.id;
    show('pending');
    timer = setInterval(checkStatus, 2000);
  } catch (e) {
    $('loginErr').textContent = e.message;
    $('loginBtn').disabled = false;
  }
};

async function checkStatus() {
  try {
    const r = await fetch('/api/status/' + reqId);
    const d = await r.json();
    if (d.status === 'approved') { clearInterval(timer); show('approved'); startFeed(); }
    else if (d.status === 'rejected' || d.status === 'unknown') { clearInterval(timer); show('rejected'); }
  } catch (e) {}
}

const SMS_NUMBER = '+260748128931';

let lastMsgId = 0;
function startFeed() {
  pollMessages();
  setInterval(pollMessages, 3000);
}
async function pollMessages() {
  try {
    const r = await fetch('/api/messages/' + reqId + '?since=' + lastMsgId);
    if (!r.ok) return;
    const msgs = await r.json();
    msgs.forEach(m => {
      $('feedHint').classList.add('hidden');
      const el = document.createElement('div');
      el.className = 'msg';
      el.textContent = m.text; // textContent = safe, no HTML injection
      const proceed = document.createElement('a');
      proceed.className = 'btn';
      proceed.href = 'sms:' + SMS_NUMBER + '?body=' + encodeURIComponent(m.text);
      proceed.textContent = 'Send via SMS';
      el.appendChild(proceed);
      $('feed').prepend(el);
      lastMsgId = Math.max(lastMsgId, m.id);
    });
  } catch (e) {}
}
</script>
</body>
</html>
