<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order confirmed</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#7a8794; --border:#e3e8ed; --ok:#1a9b57; --accent:#229ed9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:linear-gradient(180deg,#edf9f1,#f7f7f7); color:var(--text); }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
    h1 { margin:0 0 10px; color:var(--ok); font-size:2rem; }
    p { color:var(--muted); line-height:1.6; margin:0 0 18px; }
    .plan { font-weight:700; color:var(--text); }
    a { display:inline-block; padding:12px 18px; border-radius:10px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ Confirmed</h1>
    <p>Your request for the <span id="planName" class="plan">—</span> plan has been successfully recorded.</p>
    <p id="amount">Amount: —</p>
    <a href="/">Back to home</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || '—';
    const price = params.get('price') || '—';
    document.getElementById('planName').textContent = plan;
    document.getElementById('amount').textContent = 'Amount: ' + (price === '—' ? price : 'K' + price);
  </script>
</body>
</html>
